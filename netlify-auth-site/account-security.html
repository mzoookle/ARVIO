<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Account Security · ARVIO</title><style>body{font:15px system-ui;background:#10131a;color:#f4f5f7;display:grid;min-height:100vh;place-items:center;margin:0;padding:1rem}.card{width:min(100%,30rem);padding:2rem;background:#1b202b;border-radius:1rem;box-sizing:border-box}label{display:block;margin:.9rem 0 .35rem}input{width:100%;box-sizing:border-box;padding:.8rem;border:1px solid #454e60;border-radius:.5rem;background:#111722;color:white}button{width:100%;padding:.85rem;margin-top:1rem;border:0;border-radius:.5rem;background:#647cf5;color:white;font-weight:650;cursor:pointer}button.secondary{background:#30394b}p{color:#aab2c0}#status{min-height:1.5rem;color:#cbd4e4}</style></head><body><main class="card"><h1>Account Security</h1><p>Manage the ARVIO app password used by Android and other clients, separately from your Keycloak password.</p><div id="identity"><button id="keycloak">Sign in with SSO</button><hr><h3>Already have an ARVIO password?</h3><label>Email</label><input id="email" type="email" autocomplete="username"><label>ARVIO password</label><input id="current" type="password" autocomplete="current-password"><button class="secondary" id="passwordLogin">Sign in with ARVIO password</button></div><section id="passwordForm" hidden><p id="account"></p><label>New ARVIO app password</label><input id="newPassword" type="password" autocomplete="new-password"><label>Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password"><button id="save">Set ARVIO app password</button><button class="secondary" id="link">Link Keycloak to this existing account</button></section><p id="status" role="status"></p></main><script src="/portal/portal-config.js"></script><script>
let accessToken='';let refreshToken='';const $=id=>document.getElementById(id);const api=async(path,body,token='')=>{const h={'content-type':'application/json','apikey':window.ARVIO_APP_ANON_KEY,'authorization':`Bearer ${token||window.ARVIO_APP_ANON_KEY}`};const r=await fetch(`/api/cloud/${path}`,{method:'POST',headers:h,body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d};function acceptFragment(){const p=new URLSearchParams(location.hash.slice(1));if(p.has('access_token')){accessToken=p.get('access_token');refreshToken=p.get('refresh_token')||'';history.replaceState(null,'',location.pathname+location.search);showForm(p.get('email')||'');}}function showForm(email){$('identity').hidden=true;$('passwordForm').hidden=false;$('account').textContent=`Signed in as ${email}. Your ARVIO app password is independent of Keycloak.`;}
$('keycloak').onclick=async()=>{try{$('status').textContent='Redirecting to Keycloak…';const d=await api('oidc-start',{return_to:`${window.location.origin}/portal/account/security`});sessionStorage.setItem('arvio.oidc.state',d.state);location.assign(d.authorize_url);}catch(e){$('status').textContent=e.message;}};
$('passwordLogin').onclick=async()=>{try{$('status').textContent='Signing in…';const d=await api('auth-login',{email:$('email').value,password:$('current').value});accessToken=d.access_token;refreshToken=d.refresh_token;showForm(d.user.email);}catch(e){$('status').textContent=e.message;}};
$('save').onclick=async()=>{try{const p=$('newPassword').value;if(p.length<8)throw new Error('Use at least 8 characters.');if(p!==$('confirmPassword').value)throw new Error('Passwords do not match.');await api('auth-password-set',{password:p},accessToken);$('status').textContent='Your ARVIO app password has been set. Android can now use it.';$('newPassword').value='';$('confirmPassword').value='';}catch(e){$('status').textContent=e.message;}};
$('link').onclick=async()=>{try{$('status').textContent='Starting Keycloak account linking…';const d=await api('oidc-link-start',{return_to:`${window.location.origin}/portal/account/security`},accessToken);sessionStorage.setItem('arvio.oidc.state',d.state);location.assign(d.authorize_url);}catch(e){$('status').textContent=e.message;}};acceptFragment();
</script></body></html>
