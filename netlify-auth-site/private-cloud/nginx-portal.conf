server {
    listen 8080;
    client_max_body_size 6m;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the Phase 2 administrator dashboard available on the auth portal.
    location = /admin {
        add_header Cache-Control "no-store" always;
        try_files /admin.html =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # The public /api/cloud/* edge route goes straight to the private-cloud
    # service; this static portal no longer proxies legacy function URLs.
    # Configure 512m upload size and long timeouts at Pomerium / API instead.

    location = /oidc/callback {
        add_header Cache-Control "no-store" always;
        rewrite ^ /oidc-callback.html last;
    }

    # Keycloak SSO TV pairing completion (do not redirect to the Web app).
    location = /tv-pair {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /tv-pair.html =404;
    }
    location = /tv-pair.html {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location = /account/security {
        add_header Cache-Control "no-store" always;
        rewrite ^ /account-security.html last;
    }

    # Normalize old callback URLs that used the physical HTML filename.
    location = /account-security.html/ {
        return 308 /portal/account/security;
    }
    location = /account-security.html {
        return 308 /portal/account/security;
    }

    location = /portal-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Match the upstream Netlify redirects for the account-deletion page.
    location = /delete {
        rewrite ^ /delete-account.html last;
    }
    location = /account-deletion {
        rewrite ^ /delete-account.html last;
    }
    location = /delete-account {
        rewrite ^ /delete-account.html last;
    }
    location ^~ /delete-account/ {
        rewrite ^/delete-account/.*$ /delete-account.html last;
    }
    location = /delete-account.html {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
