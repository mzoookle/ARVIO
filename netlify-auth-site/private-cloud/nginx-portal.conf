server {
    listen 8080;
    client_max_body_size 6m;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the Phase 2 administrator dashboard available on the auth portal.
    location = /admin {
        add_header Cache-Control "no-store" always;
        try_files /admin.html =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # Allow large APK uploads from authenticated ARVIO admins
    location = /.netlify/functions/admin-release-upload {
        client_max_body_size 512m;
    
        rewrite ^/\.netlify/functions/(.*)$ /$1 break;
        proxy_pass http://arvio-api:3000;
        proxy_http_version 1.1;
    
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    
        proxy_request_buffering off;
        proxy_buffering off;
    
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Preserve ARVIO's original Netlify Function URLs for the account portal,
    # while forwarding the function name to the self-hosted compatibility API.
    location ^~ /.netlify/functions/ {
        rewrite ^/\.netlify/functions/(.*)$ /$1 break;
        proxy_pass http://arvio-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
    }

    location = /oidc/callback {
        add_header Cache-Control "no-store" always;
        rewrite ^ /oidc-callback.html last;
    }

    # Keycloak SSO TV pairing completion (do not redirect to the Web app).
    location = /tv-pair {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /tv-pair.html =404;
    }
    location = /tv-pair.html {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location = /account/security {
        add_header Cache-Control "no-store" always;
        rewrite ^ /account-security.html last;
    }

    # Normalize old callback URLs that used the physical HTML filename.
    location = /account-security.html/ {
        return 308 /account/security;
    }
    location = /account-security.html {
        return 308 /account/security;
    }

    location = /portal-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Match the upstream Netlify redirects for the account-deletion page.
    location = /delete {
        rewrite ^ /delete-account.html last;
    }
    location = /account-deletion {
        rewrite ^ /delete-account.html last;
    }
    location = /delete-account {
        rewrite ^ /delete-account.html last;
    }
    location ^~ /delete-account/ {
        rewrite ^/delete-account/.*$ /delete-account.html last;
    }
    location = /delete-account.html {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
