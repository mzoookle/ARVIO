server {
    listen 8080;
    client_max_body_size 6m;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # Preserve ARVIO's original Netlify Function URLs for the account portal,
    # while forwarding the function name to the self-hosted compatibility API.
    location ^~ /.netlify/functions/ {
        rewrite ^/\.netlify/functions/(.*)$ /$1 break;
        proxy_pass http://arvio-private-cloud:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
    }

    location = /portal-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Match the upstream Netlify redirects for the account-deletion page.
    location = /delete {
        rewrite ^ /delete-account.html last;
    }
    location = /account-deletion {
        rewrite ^ /delete-account.html last;
    }
    location = /delete-account {
        rewrite ^ /delete-account.html last;
    }
    location ^~ /delete-account/ {
        rewrite ^/delete-account/.*$ /delete-account.html last;
    }
    location = /delete-account.html {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
