<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Signing in · ARVIO</title><style>body{font:16px system-ui;background:#10131a;color:#f4f5f7;display:grid;min-height:100vh;place-items:center;margin:0}.card{max-width:28rem;padding:2rem;text-align:center;background:#1b202b;border-radius:1rem}p{color:#aab2c0}</style></head><body><main class="card"><h1>Completing sign-in</h1><p id="status">Verifying your Keycloak session…</p></main><script src="/portal-config.js"></script><script>
(async()=>{const status=document.getElementById('status');try{const q=new URLSearchParams(location.search);const code=q.get('code')||'';const state=q.get('state')||'';const expected=sessionStorage.getItem('arvio.oidc.state');sessionStorage.removeItem('arvio.oidc.state');if(!code||!state||!expected||state!==expected)throw new Error('This sign-in attempt is invalid or expired. Return to the account portal and try again.');const r=await fetch('/.netlify/functions/oidc-callback',{method:'POST',headers:{'content-type':'application/json','apikey':window.ARVIO_APP_ANON_KEY,'authorization':`Bearer ${window.ARVIO_APP_ANON_KEY}`},body:JSON.stringify({code,state})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Keycloak sign-in failed.');location.replace(data.redirect_url);}catch(e){status.textContent=e.message||String(e);}})();
</script></body></html>
